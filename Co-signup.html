<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Company Sign Up | Campus2Career
    </title>


    <!-- =====================================================
         COMPANY SIGNUP CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="company-signup.css"
    >

</head>


<body>


    <!-- =====================================================
         PAGE WRAPPER
    ====================================================== -->

    <main class="page-wrapper">


        <!-- =================================================
             SIGNUP CARD
        ================================================== -->

        <section
            class="signup-card"
            aria-labelledby="signupTitle"
        >


            <!-- ==============================================
                 CAMPUS2CAREER LOGO
            =============================================== -->

            <div class="logo-container">

                <a
                    href="index.html"
                    aria-label="Campus2Career home"
                >

                    <img
                        src="logo.png"
                        alt="Campus2Career Logo"
                        class="campus-logo"
                    >

                </a>

            </div>


            <!-- ==============================================
                 BRAND HEADER
            =============================================== -->

            <header class="brand">

                <h1 id="signupTitle">
                    Company Registration
                </h1>

                <p>
                    Join Campus2Career as a company
                </p>

            </header>


            <!-- ==============================================
                 FORM CONTAINER
            =============================================== -->

            <div class="form-container">


                <h2>
                    Create Company Account
                </h2>


                <p class="subtitle">
                    Register your company to access
                    the recruiter portal.
                </p>


                <!-- ==========================================
                     COMPANY SIGNUP FORM

                     IMPORTANT IDs USED BY
                     company-signup.js:
                     companySignupForm
                     companyName
                     gmail
                     password
                     togglePassword
                     signupMessage
                     signupBtn
                =========================================== -->

                <form
                    id="companySignupForm"
                    novalidate
                >


                    <!-- ======================================
                         COMPANY NAME
                    ======================================= -->

                    <div class="form-group">

                        <label
                            for="companyName"
                        >
                            Company Name
                        </label>


                        <input
                            type="text"
                            id="companyName"
                            name="companyName"
                            placeholder="Enter company name"
                            maxlength="150"
                            autocomplete="organization"
                            required
                        >


                        <small
                            id="companyNameError"
                            class="error-message"
                            aria-live="polite"
                        ></small>

                    </div>


                    <!-- ======================================
                         GMAIL
                    ======================================= -->

                    <div class="form-group">

                        <label
                            for="gmail"
                        >
                            Gmail ID
                        </label>


                        <input
                            type="email"
                            id="gmail"
                            name="gmail"
                            placeholder="company@gmail.com"
                            maxlength="255"
                            autocomplete="email"
                            inputmode="email"
                            spellcheck="false"
                            required
                        >


                        <small
                            id="gmailError"
                            class="error-message"
                            aria-live="polite"
                        ></small>

                    </div>


                    <!-- ======================================
                         PASSWORD
                    ======================================= -->

                    <div class="form-group">

                        <label
                            for="password"
                        >
                            Password
                        </label>


                        <div class="password-wrapper">


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-controls="password"
                                aria-pressed="false"
                            >
                                Show
                            </button>

                        </div>


                        <small class="password-hint">
                            Minimum 8 characters
                        </small>


                        <small
                            id="passwordError"
                            class="error-message"
                            aria-live="polite"
                        ></small>

                    </div>


                    <!-- ======================================
                         SIGNUP MESSAGE
                    ======================================= -->

                    <div
                        id="signupMessage"
                        class="signup-message"
                        role="alert"
                        aria-live="polite"
                        hidden
                    ></div>


                    <!-- ======================================
                         SIGNUP BUTTON
                    ======================================= -->

                    <button
                        type="submit"
                        id="signupBtn"
                        class="signup-btn"
                    >
                        Create Company Account
                    </button>


                </form>


                <!-- ==========================================
                     SIGN IN LINK
                =========================================== -->

                <div class="signin-section">

                    <span>
                        Already have a company account?
                    </span>


                    <a href="company-signin.html">
                        Sign In
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         COMPANY SIGNUP JAVASCRIPT
    ====================================================== -->

    <script
        src="company-signup.js"
        defer
    ></script>


</body>

</html>
