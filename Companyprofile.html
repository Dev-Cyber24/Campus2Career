<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Company Portal | Campus2Career
    </title>


    <!-- =====================================================
         COMPANY PROFILE CSS
         Actual project filename: Comprof.css
    ====================================================== -->

    <link
        rel="stylesheet"
        href="Comprof.css"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             LEFT SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <h1>
                Companies
            </h1>


            <!-- =================================================
                 COMPANY SEARCH
            ================================================== -->

            <div class="search-box">

                <i
                    class="fas fa-search"
                    aria-hidden="true"
                ></i>


                <input
                    type="search"
                    id="searchCompany"
                    placeholder="Search Companies..."
                    autocomplete="off"
                    aria-label="Search companies"
                >

            </div>


            <!-- =================================================
                 COMPANY LIST
            ================================================== -->

            <div id="companyContainer">

                <div class="loading-message">
                    Loading companies...
                </div>

            </div>

        </aside>



        <!-- =================================================
             RIGHT MAIN CONTENT
        ================================================== -->

        <main
            class="main-content"
            id="companyMainContent"
        >


            <!-- =================================================
                 COMPANY BANNER
            ================================================== -->

            <div
                class="company-banner"
                id="companyBanner"
            ></div>



            <!-- =================================================
                 COMPANY HEADER
            ================================================== -->

            <section
                class="profile-header"
                aria-label="Company information"
            >


                <!-- =============================================
                     MAIN COMPANY LOGO
                ============================================== -->

                <div class="main-company-logo-container">

                    <img
                        id="companyLogo"
                        class="company-logo"
                        src=""
                        alt="Company Logo"
                    >

                </div>


                <!-- =============================================
                     COMPANY NAME / INDUSTRY
                ============================================== -->

                <div class="company-header-text">

                    <h1 id="companyName">
                        Select a Company
                    </h1>


                    <p id="companyIndustry">
                        Industry
                    </p>

                </div>

            </section>



            <!-- =================================================
                 COMPANY DETAILS
            ================================================== -->

            <section class="profile-card">


                <h2>
                    About Company
                </h2>


                <p id="companyAbout">
                    Select a company from the left panel.
                </p>



                <!-- =================================================
                     COMPANY INFORMATION
                ================================================== -->

                <div class="info-grid">


                    <!-- =============================================
                         INDUSTRY
                    ============================================== -->

                    <div>

                        <strong>
                            Industry
                        </strong>


                        <p id="industry">
                            -
                        </p>

                    </div>


                    <!-- =============================================
                         LOCATION
                    ============================================== -->

                    <div>

                        <strong>
                            Location
                        </strong>


                        <p id="location">
                            -
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     ACTION BUTTONS
                ================================================== -->

                <div class="action-buttons">


                    <!-- =============================================
                         WEBSITE
                    ============================================== -->

                    <a
                        id="websiteLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="visit-btn"
                    >
                        Visit Website
                    </a>



                    <!-- =============================================
                         FOLLOW
                    ============================================== -->

                    <button
                        type="button"
                        id="followBtn"
                        class="follow-btn"
                    >
                        Follow Company
                    </button>



                    <!-- =============================================
                         APPLY
                         Handled by CO.js
                    ============================================== -->

                    <button
                        type="button"
                        id="applyBtn"
                        class="apply-btn"
                    >

                        <i
                            class="fas fa-paper-plane"
                            aria-hidden="true"
                        ></i>

                        Apply Now

                    </button>

                </div>



                <!-- =================================================
                     APPLICATION STATUS
                     Handled by CO.js
                ================================================== -->

                <div
                    id="applicationMessage"
                    role="status"
                    aria-live="polite"
                    style="
                        display:none;
                        margin-top:15px;
                        padding:12px 15px;
                        border-radius:10px;
                        font-size:14px;
                    "
                ></div>

            </section>

        </main>

    </div>



    <!-- =====================================================
         COMPANY PROFILE JAVASCRIPT
         Actual project filename: CO.js

         defer ensures the HTML is parsed before JavaScript
         initializes its DOM references.
    ====================================================== -->

    <script
        src="CO.js"
        defer
    ></script>


</body>

</html>
