<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Company Portal | Campus2Career
    </title>


    <!-- =====================================================
         COMPANY PROFILE CSS
         Actual project filename: Comprof.css
    ====================================================== -->

    <link
        rel="stylesheet"
        href="Comprof.css"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- =====================================================
         JOB APPLICATION STYLES
    ====================================================== -->

    <style>

        /* =================================================
           JOB APPLICATION
        ================================================= */

        .job-application-section {
            display: flex;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 18px;
        }


        .job-application-section label {
            width: 100%;

            margin-bottom: 2px;

            font-size: 14px;

            font-weight: 600;

            color: #374151;
        }


        .job-id-select {
            min-width: 220px;

            min-height: 44px;

            padding:
                10px 12px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            background: #ffffff;

            color: #111827;

            font-size: 14px;

            outline: none;

            cursor: pointer;
        }


        .job-id-select:focus {
            border-color: #0a66c2;

            box-shadow:
                0 0 0 3px
                rgba(
                    10,
                    102,
                    194,
                    0.12
                );
        }


        .job-id-select:disabled {
            background: #f3f4f6;

            color: #6b7280;

            cursor: not-allowed;
        }


        .apply-btn:disabled {
            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        .application-message {
            display: none;

            margin-top: 15px;

            padding:
                12px 15px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.4;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .job-application-section {
                flex-direction: column;

                align-items: stretch;
            }


            .job-id-select {
                width: 100%;

                min-width: 0;
            }


            .job-application-section .apply-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             LEFT SIDEBAR
        ================================================== -->

        <aside class="sidebar">


            <h1>
                Companies
            </h1>


            <!-- =================================================
                 COMPANY SEARCH
            ================================================== -->

            <div class="search-box">

                <i
                    class="fas fa-search"
                    aria-hidden="true"
                ></i>


                <input
                    type="search"
                    id="searchCompany"
                    placeholder="Search Companies..."
                    autocomplete="off"
                    aria-label="Search companies"
                >

            </div>


            <!-- =================================================
                 COMPANY LIST
            ================================================== -->

            <div id="companyContainer">

                <div class="loading-message">
                    Loading companies...
                </div>

            </div>

        </aside>



        <!-- =================================================
             RIGHT MAIN CONTENT
        ================================================== -->

        <main
            class="main-content"
            id="companyMainContent"
        >


            <!-- =================================================
                 COMPANY BANNER
            ================================================== -->

            <div
                class="company-banner"
                id="companyBanner"
            ></div>



            <!-- =================================================
                 COMPANY HEADER
            ================================================== -->

            <section
                class="profile-header"
                aria-label="Company information"
            >


                <!-- =============================================
                     MAIN COMPANY LOGO
                ============================================== -->

                <div class="main-company-logo-container">

                    <img
                        id="companyLogo"
                        class="company-logo"
                        src=""
                        alt="Company Logo"
                    >

                </div>


                <!-- =============================================
                     COMPANY NAME / INDUSTRY
                ============================================== -->

                <div class="company-header-text">

                    <h1 id="companyName">
                        Select a Company
                    </h1>


                    <p id="companyIndustry">
                        Industry
                    </p>

                </div>

            </section>



            <!-- =================================================
                 COMPANY DETAILS
            ================================================== -->

            <section class="profile-card">


                <h2>
                    About Company
                </h2>


                <p id="companyAbout">
                    Select a company from the left panel.
                </p>



                <!-- =================================================
                     COMPANY INFORMATION
                ================================================== -->

                <div class="info-grid">


                    <!-- =============================================
                         INDUSTRY
                    ============================================== -->

                    <div>

                        <strong>
                            Industry
                        </strong>


                        <p id="industry">
                            -
                        </p>

                    </div>


                    <!-- =============================================
                         LOCATION
                    ============================================== -->

                    <div>

                        <strong>
                            Location
                        </strong>


                        <p id="location">
                            -
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     WEBSITE / FOLLOW ACTIONS
                ================================================== -->

                <div class="action-buttons">


                    <!-- =============================================
                         WEBSITE
                    ============================================== -->

                    <a
                        id="websiteLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="visit-btn"
                    >
                        Visit Website
                    </a>



                    <!-- =============================================
                         FOLLOW
                    ============================================== -->

                    <button
                        type="button"
                        id="followBtn"
                        class="follow-btn"
                    >
                        Follow Company
                    </button>

                </div>



                <!-- =================================================
                     JOB APPLICATION
                ================================================== -->

                <div
                    class="job-application-section"
                    id="jobApplicationSection"
                >

                    <label
                        for="jobIdSelect"
                    >
                        Select Job / Internship
                    </label>


                    <select
                        id="jobIdSelect"
                        class="job-id-select"
                        aria-label="Select a job or internship"
                    >

                        <option value="">
                            Select a Job ID
                        </option>

                    </select>


                    <button
                        type="button"
                        id="applyBtn"
                        class="apply-btn"
                        disabled
                    >

                        <i
                            class="fas fa-paper-plane"
                            aria-hidden="true"
                        ></i>

                        Apply Now

                    </button>

                </div>



                <!-- =================================================
                     APPLICATION STATUS
                ================================================== -->

                <div
                    id="applicationMessage"
                    class="application-message"
                    role="status"
                    aria-live="polite"
                ></div>


            </section>

        </main>

    </div>



    <!-- =====================================================
         COMPANY PROFILE JAVASCRIPT
         Actual project filename: CO.js

         defer ensures the HTML is parsed before JavaScript
         initializes its DOM references.
    ====================================================== -->

    <script
        src="CO.js"
        defer
    ></script>


</body>

</html>
