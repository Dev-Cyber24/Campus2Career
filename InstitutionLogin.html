<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Institution Login | Campus2Career</title>

    <link
        rel="stylesheet"
        href="InstitutionLogin.css"
    >

</head>

<body>

    <main class="login-page">

        <section
            class="login-card"
            aria-labelledby="loginTitle"
        >

            <!-- ================================= -->
            <!-- CAMPUS2CAREER LOGO -->
            <!-- ================================= -->

            <div class="brand">

                <img
                    src="logo.png"
                    alt="Campus2Career Logo"
                >

            </div>


            <!-- ================================= -->
            <!-- PORTAL LABEL -->
            <!-- ================================= -->

            <div class="portal-label">
                Institution Portal
            </div>


            <!-- ================================= -->
            <!-- TITLE -->
            <!-- ================================= -->

            <h1 id="loginTitle">
                Institution Login
            </h1>

            <p class="subtitle">
                Sign in to manage your Campus2Career institution profile.
            </p>


            <!-- ================================= -->
            <!-- MESSAGE -->
            <!-- ================================= -->

            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></div>


            <!-- ================================= -->
            <!-- LOGIN FORM -->
            <!-- ================================= -->

            <form
                id="institutionLoginForm"
                autocomplete="on"
            >

                <!-- ================================= -->
                <!-- EMAIL -->
                <!-- ================================= -->

                <div class="form-group">

                    <label for="email">
                        Official Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="institution@example.com"
                        autocomplete="username"
                        inputmode="email"
                        required
                    >

                </div>


                <!-- ================================= -->
                <!-- PASSWORD -->
                <!-- ================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- ================================= -->
                <!-- LOGIN BUTTON -->
                <!-- ================================= -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Sign In
                </button>

            </form>


            <!-- ================================= -->
            <!-- REGISTER LINK -->
            <!-- ================================= -->

            <div class="register-link">

                Don't have an institution account?

                <a
                    href="InstitutionRegistration.html"
                >
                    Register Institution
                </a>

            </div>


            <!-- ================================= -->
            <!-- BACK TO USER LOGIN -->
            <!-- ================================= -->

            <a
                class="back-link"
                href="login.html"
            >
                ← Back to User Login
            </a>

        </section>

    </main>


    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <script
        src="InstitutionLogin.js"
        defer
    ></script>

</body>

</html>
