
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company Sign In | Campus2Career</title>

    <link
        rel="stylesheet"
        href="company-signin.css"
    >

</head>

<body>

    <div class="page-wrapper">

        <div class="signin-card">

            <!-- ======================================
                 CAMPUS2CAREER LOGO
            ======================================= -->

            <div class="logo-container">

                <a href="index.html">

                    <img
                        src="logo.png"
                        alt="Campus2Career Logo"
                        class="campus-logo"
                    >

                </a>

            </div>


            <!-- ======================================
                 BRAND HEADER
            ======================================= -->

            <div class="brand">

                <h1>
                    Company Portal
                </h1>

                <p>
                    Sign in to manage your company account
                </p>

            </div>


            <!-- ======================================
                 FORM
            ======================================= -->

            <div class="form-container">

                <h2>
                    Company Sign In
                </h2>

                <p class="subtitle">
                    Enter your company credentials to continue.
                </p>


                <form id="companySigninForm">

                    <!-- GMAIL -->

                    <div class="form-group">

                        <label for="gmail">
                            Gmail ID
                        </label>

                        <input
                            type="email"
                            id="gmail"
                            name="gmail"
                            placeholder="company@gmail.com"
                            autocomplete="email"
                            required
                        >

                        <small
                            id="gmailError"
                            class="error-message"
                        ></small>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            id="passwordError"
                            class="error-message"
                        ></small>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="signinMessage"
                        class="signin-message"
                        style="display: none;"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        id="signinBtn"
                        class="signin-btn"
                    >
                        Sign In
                    </button>

                </form>


                <!-- ======================================
                     SIGN UP LINK
                ======================================= -->

                <div class="signup-section">

                    <span>
                        Don't have a company account?
                    </span>

                    <a href="Co-signup.html">
                        Create Account
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- COMPANY SIGN-IN JAVASCRIPT -->

    <script
        src="company-signin.js"
        defer
    ></script>

</body>

</html>
